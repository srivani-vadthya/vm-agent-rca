ui_preferences:
  inputs:
    - name: "query"
      label: "Paste Error Log or Ask Question"
      component_type: "textarea"
      placeholder: "e.g., connection refused on localhost:9092"
      default: "Analyze this log: "
  outputs:
    - name: "response"
      label: "Analysis Response"
      component_type: "text_area"
      widget: "text_area"
    - name: "message_type"
      label: "Query Type"
      component_type: "metric_card"
      widget: "metric_card"
