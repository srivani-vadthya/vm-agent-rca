openapi: "3.0.0"
info:
  title: "RCA Chat Agent"
  version: "1.0.0"
  description: "AI-powered Root Cause Analysis (RCA) agent for intelligent error analysis, log troubleshooting, and technical problem-solving."
servers:
  - url: "https://rca-chat-backend.onrender.com"
paths:
  /execute:
    post:
      summary: "Trigger Agent Action"
      description: "Analyze error logs and technical issues using RCA"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                query:
                  type: string
                  description: "Error log or question to analyze"
                  example: "connection refused on localhost:9092"
                limit:
                  type: integer
                  description: "Max response length"
                  default: 500
              required:
                - query
      responses:
        '200':
          description: "Success response containing RCA analysis"
          content:
            application/json:
              schema:
                type: object
                properties:
                  response:
                    type: string
                    description: "Detailed analysis and recommendations"
                  message_type:
                    type: string
                    enum: ["error_log", "greeting", "simple_question", "complex_question", "general"]
                    description: "Type of query detected"
        '500':
          description: "Server error"
